name: build

on: [push, pull_request]

jobs:
  ubuntu:
    if: ${{ false }}
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        java: [11]
        arch: [x86_64, aarch64, riscv64]
        app: [mi, alisto]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: sudo apt-get install makeself
      - if: ${{ matrix.arch == 'riscv64' }}
        run: |
          # TODO: remove after migrating to JDK21+
          echo "ANT_ARGS=-Djlink.java.version=21.0.9+15" >> $GITHUB_ENV
      - run: ant -Dtarget.arch=${{ matrix.arch }} -Dauthcert.use=${{ matrix.app }}.pem makeself
      - name: Read artifact name
        id: artifact
        shell: bash
        run: |
          file=(out/qz-tray-*.run)
          echo "name=${{ matrix.app }}-$(basename "${file[0]}" .run)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/qz-tray-*.run
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          sudo apt-get install firefox chromium
          ant testng
          # Run policy tests again, but as root
          sudo ant -Dtestng.pattern="**/policy/**" testng
          sudo DEBUG=true out/qz-tray-*.run
          /opt/qz-tray/qz-tray --version
          sudo apt-get install nsis
          ant -Dauthcert.use=${{ matrix.app }}.pem nsis

  macos:
    if: ${{ false }}
    runs-on: [macos-latest]
    strategy:
      matrix:
        java: [11]
        arch: [x86_64, aarch64]
        app: [mi, alisto]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: ant -Dtarget.arch=${{ matrix.arch }} -Dauthcert.use=${{ matrix.app }}.pem pkgbuild
      - name: Read artifact name
        id: artifact
        shell: bash
        run: |
          file=(out/qz-tray-*.pkg)
          echo "name=${{ matrix.app }}-$(basename "${file[0]}" .pkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/qz-tray-*.pkg
      - if: ${{ matrix.arch == 'aarch64' }}
        run: |
          # Only run tests on same arch
          brew install --cask google-chrome firefox
          ant testng
          # Run policy tests again, but as root
          sudo ant -Dtestng.pattern="**/policy/**" testng
          sudo installer -pkg out/qz-tray-*.pkg -target /
          "/Applications/QZ Tray.app/Contents/MacOS/QZ Tray" --version
          brew install nsis makeself
          ant -Dauthcert.use=${{ matrix.app }}.pem makeself
          ant -Dauthcert.use=${{ matrix.app }}.pem nsis

  windows:
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [11]
        arch: [x86_64, aarch64]
        app: [mi, alisto]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: choco install nsis
      - run: ant "-Dtarget.arch=${{ matrix.arch }}" "-Dauthcert.use=${{ matrix.app }}.pem" nsis
      - name: Read artifact name
        id: artifact
        shell: bash
        run: |
          file=(out/qz-tray-*.exe)
          echo "name=${{ matrix.app }}-$(basename "${file[0]}" .exe)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/qz-tray-*.exe
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          choco install firefox googlechrome
          ant testng
          Start-Process -Wait ./out/qz-tray-*.exe -ArgumentList "/S"
          "&'C:/Program Files/QZ Tray/qz-tray.exe' --wait --version|Out-Null"
